<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/portfolio-site/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="512x512" href="/portfolio-site/images/icon.png">
  <style>
    :root { --bg: #f8fafc; --text: #0f172a; --muted: #475569; --accent: #0891b2; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1120; --text: #e2e8f0; --muted: #94a3b8; --accent: #22d3ee; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
           background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    h1 { font-size: clamp(3rem, 12vw, 6rem); margin: 0; background: linear-gradient(120deg, #06b6d4, #3b82f6);
         -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: var(--muted); }
    a { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Sorry, we couldn't find what you were looking for.</p>
    <a href="/portfolio-site/">Go home</a>
  </main>
</body>
</html>
